[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "galleryvault"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.6,<3",
  "SQLAlchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<1",
  "httpx[socks]>=0.27,<1",
  "alembic>=1.19.1,<2",
  "rarfile>=4.2,<5",
  "httpx>=0.27,<1",
  "Pillow>=10.4,<12",
  "cryptography>=42,<45",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<1", "pytest-cov>=5,<7", "ruff>=0.8,<1"]
socks = ["httpx[socks]>=0.27,<1"]

[tool.hatch.build.targets.wheel]
packages = ["galleryvault"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
