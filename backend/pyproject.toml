[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "galleryvault"
version = "1.5.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.141.1,<1",
  "uvicorn>=0.52.4,<1",
  "pydantic-settings>=2.15.0,<3",
  "SQLAlchemy[asyncio]>=2.0.52,<3",
  "asyncpg>=0.31.0,<1",
  "httpx[socks]>=0.28.1,<1",
  "alembic>=1.19.1,<2",
  "rarfile>=4.5,<5",
  "httpx>=0.28.1,<1",
  "Pillow>=12.3.0,<13",
  "cryptography>=50.0.1,<51",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1,<10", "pytest-asyncio>=1.4.0,<2", "pytest-cov>=7.1.0,<8", "pytest-xdist>=3.5,<4", "ruff>=0.16.4,<1", "pre-commit>=3.7,<5"]
socks = ["httpx[socks]>=0.28.1,<1"]

[tool.hatch.build.targets.wheel]
packages = ["galleryvault"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
