name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  # Multi-arch image manifest; nginx:1.27-alpine ships both.
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: JS syntax check
        run: node --check assets/app.js

  build-push:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    needs: [secrets-scan, syntax-check]
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU (multi-arch builds under emulation)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/galleryvault-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/galleryvault-frontend:${{ github.sha }}
            ${{ github.ref_type == 'tag' && format('{0}/galleryvault-frontend:{1}', secrets.DOCKERHUB_USERNAME, github.ref_name) || '' }}
          platforms: ${{ env.PLATFORMS }}
