limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

# ---- TLS (optional) ---------------------------------------------------------
# To expose the UI over HTTPS, mount your certificate into the frontend
# container, point the paths below at it, and set `auth_cookie_secure=True`
# (Settings env: AUTH_COOKIE_SECURE) so the session cookie is only sent over
# TLS. Then uncomment this block (and, optionally, redirect port 80 → 443).
#
# server {
#     listen 443 ssl;
#     http2 on;
#     server_name _;
#     ssl_certificate     /etc/nginx/tls/fullchain.pem;
#     ssl_certificate_key /etc/nginx/tls/privkey.pem;
#     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
#     ... (same locations as the :80 server below) ...
# }
# docker-compose volumes:  - ./tls:/etc/nginx/tls:ro   (on the frontend service)

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 2m;

    # Gzip compression for static assets and API payloads
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        text/xml
        application/xml
        application/xml+rss
        application/manifest+json
        image/svg+xml;

    # Resolve the backend service name per request, preferring IPv4 only.
    # The compose network can carry IPv6, but the backend listens on IPv4
    # (uvicorn --host 0.0.0.0); a static proxy_pass would resolve once at
    # startup and try the container's IPv6 address first, failing until nginx
    # falls back to IPv4. That surfaced as intermittent connection-refused
    # (and a bogus "wrong password" on the login page) right after container
    # upgrades. ipv6=off makes nginx ignore AAAA records so it always uses the
    # reachable IPv4 address. 127.0.0.11 is Docker's embedded DNS.
    resolver 127.0.0.11 ipv6=off valid=5s;

    # img-src is the only directive widened: the online reader loads page
    # images / thumbnail sprites straight from EH's image hosts (hath nodes on
    # arbitrary ports, ehgt.org, and the gallery site domains). script-src and
    # connect-src stay 'self'. Keep this list identical in every location below
    # and in backend/galleryvault/app/middleware.py.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://ehgt.org https://*.ehgt.org https://*.hath.network:* https://e-hentai.org https://*.e-hentai.org https://exhentai.org https://*.exhentai.org; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; worker-src 'self'; frame-ancestors 'none'" always;

    # Security headers are repeated in every location that sets add_header:
    # nginx does not inherit server-level add_header directives into a
    # location that declares its own, so omitting them here would silently
    # drop nosniff / X-Frame-Options / Referrer-Policy / CSP.

    # SPA: serve index.html for any non-asset path (hash-routed).
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://ehgt.org https://*.ehgt.org https://*.hath.network:* https://e-hentai.org https://*.e-hentai.org https://exhentai.org https://*.exhentai.org; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; worker-src 'self'; frame-ancestors 'none'" always;
        try_files $uri $uri/ /index.html;
    }

    # The SPA shell must be revalidated so a deploy is picked up on refresh.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://ehgt.org https://*.ehgt.org https://*.hath.network:* https://e-hentai.org https://*.e-hentai.org https://exhentai.org https://*.exhentai.org; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; worker-src 'self'; frame-ancestors 'none'" always;
        try_files $uri =404;
    }

    # Vite emits content-hashed files under /assets/, so they can be cached
    # forever; a new build produces new names and index.html is revalidated.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://ehgt.org https://*.ehgt.org https://*.hath.network:* https://e-hentai.org https://*.e-hentai.org https://exhentai.org https://*.exhentai.org; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; worker-src 'self'; frame-ancestors 'none'" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        # default_type (not add_header) so exactly one Content-Type is sent:
        # add_header appends a second header on top of the mime type.
        default_type application/manifest+json;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://ehgt.org https://*.ehgt.org https://*.hath.network:* https://e-hentai.org https://*.e-hentai.org https://exhentai.org https://*.exhentai.org; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; worker-src 'self'; frame-ancestors 'none'" always;
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://ehgt.org https://*.ehgt.org https://*.hath.network:* https://e-hentai.org https://*.e-hentai.org https://exhentai.org https://*.exhentai.org; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; worker-src 'self'; frame-ancestors 'none'" always;
        try_files $uri =404;
    }

    # Reverse proxy the JSON API + auth to the backend service. The upstream
    # host is set via a variable so nginx re-resolves it (through the resolver
    # above, IPv4 only) instead of caching the first lookup for the process
    # lifetime; a proxy_pass variable with no URI forwards the request path
    # unchanged.
    # Thumbnails and page images are bursty (grid / reader). Do not share the
    # JSON API 30r/s limit — that returns 503 and leaves broken <img> tiles.
    location ~ ^/api/galleries/[0-9]+/(thumb|pages)/ {
        set $gv_backend backend:8001;
        proxy_pass http://$gv_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Online reader fallback: server-side image proxy, used only when a device
    # switches away from direct EH image loading. One request per page and a
    # slow upstream, so it keeps the media timeouts and must not inherit the
    # 30r/s JSON API limit (503 would break the reader). Direct mode never hits
    # this location; the CSP above covers direct image hosts.
    location ~ ^/api/eh/galleries/[0-9]+/[0-9a-f]+/pages/[0-9]+/image$ {
        set $gv_backend backend:8001;
        proxy_pass http://$gv_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /api/ {
        limit_req zone=api burst=60 nodelay;
        set $gv_backend backend:8001;
        proxy_pass http://$gv_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /login and /logout go to the backend. GET /login is handled there as a
    # redirect to / (the SPA root) so e.g. /login?error=1 lands back on the SPA.
    location = /login {
        limit_req zone=login burst=5 nodelay;
        set $gv_backend backend:8001;
        proxy_pass http://$gv_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /logout {
        set $gv_backend backend:8001;
        proxy_pass http://$gv_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
