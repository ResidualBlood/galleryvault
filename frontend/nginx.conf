limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 2m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;

    # SPA: serve index.html for any non-asset path (hash-routed).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets (no-cache so deploys always serve fresh JS/CSS).
    location /assets/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Reverse proxy the JSON API + auth to the backend service.
    location /api/ {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /login and /logout go to the backend. GET /login is handled there as a
    # redirect to / (the SPA root) so e.g. /login?error=1 lands back on the SPA.
    location = /login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://backend:8001/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /logout {
        proxy_pass http://backend:8001/logout;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}