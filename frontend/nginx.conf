limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

# ---- TLS (optional) ---------------------------------------------------------
# To expose the UI over HTTPS, mount your certificate into the frontend
# container, point the paths below at it, and set `auth_cookie_secure=True`
# (Settings env: AUTH_COOKIE_SECURE) so the session cookie is only sent over
# TLS. Then uncomment this block (and, optionally, redirect port 80 → 443).
#
# server {
#     listen 443 ssl;
#     http2 on;
#     server_name _;
#     ssl_certificate     /etc/nginx/tls/fullchain.pem;
#     ssl_certificate_key /etc/nginx/tls/privkey.pem;
#     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
#     ... (same locations as the :80 server below) ...
# }
# docker-compose volumes:  - ./tls:/etc/nginx/tls:ro   (on the frontend service)

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 2m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;

    # SPA: serve index.html for any non-asset path (hash-routed).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets (no-cache so deploys always serve fresh JS/CSS).
    location /assets/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Reverse proxy the JSON API + auth to the backend service.
    location /api/ {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /login and /logout go to the backend. GET /login is handled there as a
    # redirect to / (the SPA root) so e.g. /login?error=1 lands back on the SPA.
    location = /login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://backend:8001/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /logout {
        proxy_pass http://backend:8001/logout;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}