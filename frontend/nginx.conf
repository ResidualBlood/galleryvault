server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: serve index.html for any non-asset path (hash-routed).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets (no-cache so deploys always serve fresh JS/CSS).
    location /assets/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Reverse proxy the JSON API + auth to the backend service.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /login and /logout go to the backend. GET /login is handled there as a
    # redirect to / (the SPA root) so e.g. /login?error=1 lands back on the SPA.
    location = /login {
        proxy_pass http://backend:8000/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /logout {
        proxy_pass http://backend:8000/logout;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}