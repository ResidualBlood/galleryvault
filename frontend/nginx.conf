limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

# ---- TLS (optional) ---------------------------------------------------------
# To expose the UI over HTTPS, mount your certificate into the frontend
# container, point the paths below at it, and set `auth_cookie_secure=True`
# (Settings env: AUTH_COOKIE_SECURE) so the session cookie is only sent over
# TLS. Then uncomment this block (and, optionally, redirect port 80 → 443).
#
# server {
#     listen 443 ssl;
#     http2 on;
#     server_name _;
#     ssl_certificate     /etc/nginx/tls/fullchain.pem;
#     ssl_certificate_key /etc/nginx/tls/privkey.pem;
#     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
#     ... (same locations as the :80 server below) ...
# }
# docker-compose volumes:  - ./tls:/etc/nginx/tls:ro   (on the frontend service)

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 2m;

    # Gzip compression for static assets and API payloads
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        text/xml
        application/xml
        application/xml+rss
        application/manifest+json
        image/svg+xml;

    # Resolve the backend service name per request, preferring IPv4 only.
    # The compose network can carry IPv6, but the backend listens on IPv4
    # (uvicorn --host 0.0.0.0); a static proxy_pass would resolve once at
    # startup and try the container's IPv6 address first, failing until nginx
    # falls back to IPv4. That surfaced as intermittent connection-refused
    # (and a bogus "wrong password" on the login page) right after container
    # upgrades. ipv6=off makes nginx ignore AAAA records so it always uses the
    # reachable IPv4 address. 127.0.0.11 is Docker's embedded DNS.
    resolver 127.0.0.11 ipv6=off valid=5s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://ehgt.org; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; worker-src 'self'; frame-ancestors 'none'" always;

    # SPA: serve index.html for any non-asset path (hash-routed).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets (no-cache so deploys always serve fresh JS/CSS).
    location /assets/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        add_header Content-Type "application/manifest+json";
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
    }

    # Reverse proxy the JSON API + auth to the backend service. The upstream
    # host is set via a variable so nginx re-resolves it (through the resolver
    # above, IPv4 only) instead of caching the first lookup for the process
    # lifetime; a proxy_pass variable with no URI forwards the request path
    # unchanged.
    location /api/ {
        limit_req zone=api burst=60 nodelay;
        set $gv_backend backend:8001;
        proxy_pass http://$gv_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /login and /logout go to the backend. GET /login is handled there as a
    # redirect to / (the SPA root) so e.g. /login?error=1 lands back on the SPA.
    location = /login {
        limit_req zone=login burst=5 nodelay;
        set $gv_backend backend:8001;
        proxy_pass http://$gv_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /logout {
        set $gv_backend backend:8001;
        proxy_pass http://$gv_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}