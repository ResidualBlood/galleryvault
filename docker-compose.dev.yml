services:
  frontend:
    image: residualblood/galleryvault-frontend:dev
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: galleryvault-dev-frontend
    restart: unless-stopped
    ports: ["${DEV_FRONTEND_PORT:-8200}:80"]
    volumes:
      - ./frontend/assets:/usr/share/nginx/html/assets:ro
      - ./frontend/index.html:/usr/share/nginx/html/index.html:ro
    depends_on:
      - backend

  backend:
    image: residualblood/galleryvault-backend:dev
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: galleryvault-dev-backend
    restart: unless-stopped
    command: ["uvicorn", "galleryvault.app.main:app", "--host", "0.0.0.0", "--port", "8001", "--reload", "--reload-dir", "/app/galleryvault", "--proxy-headers", "--forwarded-allow-ips=172.16.0.0/12,127.0.0.1"]
    environment:
      DATABASE_URL: postgresql+asyncpg://galleryvault:galleryvault@db:5432/galleryvault
      TZ: Asia/Shanghai
    ports: ["${DEV_BACKEND_PORT:-8201}:8001"]
    volumes:
      - ./backend/galleryvault:/app/galleryvault
      - ./backend/tests:/app/tests
      - ./library:/library
      - ./downloads:/downloads
      # Optional Archive volumes for cold storage. You can mount multiple disks/volumes
      # and configure them in Settings (e.g. /archive, /archive2).
      # - ./Archive:/archive
      # - ./Archive2:/archive2
      - ./cache:/gv-cache
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: galleryvault-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: galleryvault
      POSTGRES_PASSWORD: galleryvault
      POSTGRES_DB: galleryvault
    volumes:
      - ./db-data-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U galleryvault"]
      interval: 5s
      timeout: 3s
      retries: 5
