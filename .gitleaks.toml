# Gitleaks configuration file
[extend]
useDefault = true

[allowlist]
description = "Global allowlists for false positives in documentation examples"
ids = [
    "curl-auth-user",
]
paths = [
    '''backend/docs/API\.md''',
    '''backend/tests/test_logging\.py''',
]
regexes = [
    '''curl -u <user:pass>''',
    '''curl -u <user>:<pass>''',
]
