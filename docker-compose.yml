services:
  frontend:
    image: residualblood/galleryvault-frontend:latest
    container_name: galleryvault-frontend
    restart: always
    ports: ["8000:80"]
    depends_on:
      - backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: residualblood/galleryvault-backend:latest
    container_name: galleryvault-backend
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://galleryvault:${POSTGRES_PASSWORD:-galleryvault}@db:5432/galleryvault
      TZ: Asia/Shanghai
      # PUID: 1000
      # PGID: 1000
      # ENCRYPTION_KEY: change-me-to-a-long-random-string
      # AUTH_SECRET: change-me-to-a-random-secret
      # TRUSTED_PROXIES: 127.0.0.1,192.168.1.0/24
    ports: ["127.0.0.1:8001:8001"]
    volumes:
      - ./library:/library
      - ./downloads:/downloads
      # - ./archive:/archive
      # - ./archive2:/archive2
      - ./cache:/gv-cache
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 6
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:18-alpine
    container_name: galleryvault-db
    restart: always
    environment:
      POSTGRES_USER: galleryvault
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-galleryvault}
      POSTGRES_DB: galleryvault
      TZ: Asia/Shanghai
    volumes:
      - ./db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U galleryvault -d galleryvault"]
      interval: 5s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
