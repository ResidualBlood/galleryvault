name: sync-wiki

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "docs/wiki/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout meta repo
        uses: actions/checkout@v7

      - name: Checkout wiki
        uses: actions/checkout@v7
        with:
          repository: ResidualBlood/galleryvault.wiki
          token: ${{ secrets.SYNC_TOKEN }}
          path: wiki

      - name: Sync docs/wiki to wiki
        run: |
          rsync -a --delete \
            --exclude='.git' \
            --exclude='API.md' --exclude='Development.md' --exclude='openapi.json' \
            docs/wiki/ wiki/

      - name: Commit and push
        run: |
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "no changes"
            exit 0
          fi
          git add -A
          git commit -m "docs: sync wiki from galleryvault/docs/wiki"
          git push
