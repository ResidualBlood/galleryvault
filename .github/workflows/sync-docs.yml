name: sync-docs

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "backend/docs/**"
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Checkout wiki
        uses: actions/checkout@v7
        with:
          repository: ResidualBlood/galleryvault.wiki
          token: ${{ secrets.SYNC_TOKEN }}
          path: wiki

      - name: Copy backend reference docs into wiki
        run: |
          cp backend/docs/API.md wiki/API.md
          cp backend/docs/DEVELOPMENT.md wiki/Development.md
          cp backend/docs/openapi.json wiki/openapi.json

      - name: Commit if changed
        run: |
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add API.md Development.md openapi.json
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "docs: sync API/development reference from backend/docs"
          git push || (git pull --rebase origin master && git push)
