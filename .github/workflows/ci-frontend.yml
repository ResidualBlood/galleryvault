name: ci-frontend

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, dev]
    paths:
      - "frontend/**"
      - "!frontend/**/*.md"
      - ".github/workflows/ci-frontend.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "frontend/**"
      - "!frontend/**/*.md"
      - ".github/workflows/ci-frontend.yml"

jobs:
  detect-image:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.d.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: d
        run: |
          BEFORE="${{ github.event.before }}"
          SHA="${{ github.sha }}"
          image=true
          if [ -n "$BEFORE" ] && ! echo "$BEFORE" | grep -q '^0\+$'; then
            if files=$(git diff --name-only "$BEFORE" "$SHA"); then
              echo "$files"
              # After the cutover the image is built from frontend/ as a whole.
              # Paths excluded by frontend/.dockerignore (e2e, docs, scripts,
              # markdown) cannot change the bundle; parity/settings-map.json is
              # imported at build time, so it can.
              relevant=false
              while IFS= read -r f; do
                case "$f" in
                  .github/workflows/ci-frontend.yml) relevant=true ;;
                  frontend/e2e/*|frontend/docs/*|frontend/scripts/*) ;;
                  frontend/parity/*)
                    if [ "$f" = "frontend/parity/settings-map.json" ]; then
                      relevant=true
                    fi
                    ;;
                  frontend/*.md) ;;
                  frontend/*) relevant=true ;;
                esac
              done <<< "$files"
              if [ "$relevant" = false ]; then
                image=false
              fi
            fi
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "image=$image"

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Unit tests
        working-directory: frontend
        run: npm run test:unit
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Bundle guard (CSP / no eval)
        run: node frontend/scripts/check-dist.mjs
      - name: Design guard
        run: node frontend/scripts/check-design.mjs
      - name: Legacy parity guard
        run: node frontend/scripts/check-parity.mjs --strict
      - name: nginx config test
        run: docker run --rm -v "$PWD/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro" nginx:1.27-alpine nginx -t

  build:
    needs: [detect-image]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && needs.detect-image.outputs.image == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: frontend
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ secrets.DOCKERHUB_USERNAME }}/galleryvault-frontend,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=build-frontend-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=build-frontend-${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-frontend-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && needs.detect-image.outputs.image == 'true'
    runs-on: ubuntu-latest
    needs: [detect-image, secrets-scan, syntax-check, build]
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-frontend-*
          merge-multiple: true

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          TAG_ARGS=""
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TAG_ARGS="$TAG_ARGS -t ${{ secrets.DOCKERHUB_USERNAME }}/galleryvault-frontend:latest"
          fi
          if [ "${{ github.ref }}" = "refs/heads/dev" ]; then
            TAG_ARGS="$TAG_ARGS -t ${{ secrets.DOCKERHUB_USERNAME }}/galleryvault-frontend:dev"
          fi
          TAG_ARGS="$TAG_ARGS -t ${{ secrets.DOCKERHUB_USERNAME }}/galleryvault-frontend:${{ github.sha }}"
          
          docker buildx imagetools create $TAG_ARGS $(printf '${{ secrets.DOCKERHUB_USERNAME }}/galleryvault-frontend@sha256:%s ' *)
