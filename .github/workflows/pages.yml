name: pages

on:
  push:
    branches: [main, dev]
    paths:
      - "docs/wiki/**"
      - "docs-site/**"
      - "backend/docs/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: docs-site

      - name: Cache Vite build cache
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            docs-site/.vitepress/cache
            docs-site/node_modules/.vite
          key: vite-cache-${{ runner.os }}-${{ hashFiles('docs-site/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            vite-cache-${{ runner.os }}-${{ hashFiles('docs-site/package-lock.json') }}-
            vite-cache-${{ runner.os }}-

      - name: Sync canonical docs into source dir
        run: npm run sync
        working-directory: docs-site

      - name: Build VitePress site
        run: npm run build
        working-directory: docs-site

      - name: Configure Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs-site/.vitepress/dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
