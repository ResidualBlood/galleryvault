name: pages

on:
  push:
    branches: [main]
    paths:
      - "docs/wiki/**"
      - "docs-site/**"
      - "backend/docs/**"
      - ".github/workflows/pages.yml"
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Check for changes
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          set +e
          LAST_SHA=$(gh api "repos/${{ github.repository }}/actions/workflows/pages.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].head_sha' 2>/dev/null)

          if [ -z "$LAST_SHA" ] || [ "$LAST_SHA" = "null" ]; then
            echo "No previous successful run found, proceeding with build."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Last successful run sha: $LAST_SHA"
          echo "Current sha: ${{ github.sha }}"

          if [ "$LAST_SHA" = "${{ github.sha }}" ]; then
            echo "Head SHA unchanged since last successful run."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED_FILES=$(gh api "repos/${{ github.repository }}/compare/${LAST_SHA}...${{ github.sha }}" --jq '.files[].filename' 2>/dev/null)
          API_STATUS=$?

          if [ $API_STATUS -ne 0 ] || [ -z "$CHANGED_FILES" ]; then
            echo "Compare API failed or empty, fallback to build."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          MATCHED=$(echo "$CHANGED_FILES" | grep -E '^(docs/wiki/|docs-site/|backend/docs/|\.github/workflows/pages\.yml)' || true)
          if [ -n "$MATCHED" ]; then
            echo "Relevant changes detected:"
            echo "$MATCHED"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "No relevant docs/site changes detected."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.check.outputs.should_build == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Cache node_modules
        if: steps.check.outputs.should_build == 'true'
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: docs-site/node_modules
          key: node-modules-${{ runner.os }}-node-20-${{ hashFiles('docs-site/package-lock.json') }}

      - name: Install dependencies
        if: steps.check.outputs.should_build == 'true' && steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund
        working-directory: docs-site

      - name: Cache Vite build cache
        if: steps.check.outputs.should_build == 'true'
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            docs-site/.vitepress/cache
            docs-site/node_modules/.vite
          key: vite-cache-${{ runner.os }}-${{ hashFiles('docs-site/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            vite-cache-${{ runner.os }}-${{ hashFiles('docs-site/package-lock.json') }}-
            vite-cache-${{ runner.os }}-

      - name: Sync canonical docs into source dir
        if: steps.check.outputs.should_build == 'true'
        run: npm run sync
        working-directory: docs-site

      - name: Build VitePress site
        if: steps.check.outputs.should_build == 'true'
        run: npm run build
        working-directory: docs-site

      - name: Configure Pages
        if: github.ref == 'refs/heads/main' && steps.check.outputs.should_build == 'true'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && steps.check.outputs.should_build == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs-site/.vitepress/dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && needs.build.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
